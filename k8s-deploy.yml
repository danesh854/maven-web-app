apiVersion: apps/v1
kind: Deployment
metadata:
  name: mavenwebappdeployment

spec:
  replicas: 2

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1

  selector:
    matchLabels:
      app: mavenwebapp

  template:
    metadata:
      labels:
        app: mavenwebapp

    spec:
      containers:
      - name: mavenwebappcontainer
        image: daneshkabade45/demo:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080

---
apiVersion: v1
kind: Service
metadata:
  name: mavenwebappsvc

spec:
  type: LoadBalancer
  selector:
    app: mavenwebapp

  ports:
  - port: 80
    targetPort: 8080
